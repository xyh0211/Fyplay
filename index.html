<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能翻译 - Smart Translator</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #f8fafc 100%);
            min-height: 100vh;
            color: #1a1a2e;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding: 8px 4px 0;
        }
        .header-left h1 {
            font-size: 34px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .header-left .subtitle {
            font-size: 14px;
            color: #8e8ea0;
            margin-top: 2px;
            font-weight: 400;
        }
        .header-right {
            display: flex;
            gap: 14px;
            align-items: center;
            padding-top: 8px;
        }
        .header-right .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .header-right .icon-btn:hover {
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transform: translateY(-1px);
        }
        .header-right .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #444;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== Main Translation Panel ===== */
        .translation-panel {
            background: #ffffff;
            border: 2px solid #40A9FF;
            border-radius: 20px;
            padding: 20px 18px 14px;
            box-shadow: 0 8px 32px rgba(64, 169, 255, 0.10);
            margin-bottom: 16px;
            transition: box-shadow 0.3s, border-color 0.3s;
            position: relative;
        }
        .translation-panel:focus-within {
            box-shadow: 0 8px 32px rgba(64, 169, 255, 0.20);
        }
        .translation-panel.recording {
            border-color: #ff4d4f;
            box-shadow: 0 8px 32px rgba(255, 77, 79, 0.15);
        }

        /* Recording visualizer bar */
        .recording-visualizer {
            display: none;
            align-items: center;
            gap: 3px;
            height: 32px;
            padding: 4px 0;
            margin-bottom: 2px;
        }
        .recording-visualizer.active {
            display: flex;
        }
        .recording-visualizer .bar {
            flex: 1;
            max-width: 4px;
            background: linear-gradient(to top, #ff4d4f, #ff7875);
            border-radius: 2px;
            height: 4px;
            animation: wave 0.8s ease-in-out infinite alternate;
        }
        .recording-visualizer .bar:nth-child(1) { animation-delay: 0.0s; height: 12px; }
        .recording-visualizer .bar:nth-child(2) { animation-delay: 0.1s; height: 20px; }
        .recording-visualizer .bar:nth-child(3) { animation-delay: 0.2s; height: 28px; }
        .recording-visualizer .bar:nth-child(4) { animation-delay: 0.3s; height: 24px; }
        .recording-visualizer .bar:nth-child(5) { animation-delay: 0.15s; height: 16px; }
        .recording-visualizer .bar:nth-child(6) { animation-delay: 0.25s; height: 30px; }
        .recording-visualizer .bar:nth-child(7) { animation-delay: 0.05s; height: 22px; }
        .recording-visualizer .bar:nth-child(8) { animation-delay: 0.35s; height: 26px; }
        .recording-visualizer .bar:nth-child(9) { animation-delay: 0.2s; height: 14px; }
        .recording-visualizer .bar:nth-child(10) { animation-delay: 0.1s; height: 18px; }
        .recording-visualizer .bar:nth-child(11) { animation-delay: 0.3s; height: 28px; }
        .recording-visualizer .bar:nth-child(12) { animation-delay: 0.05s; height: 22px; }
        .recording-visualizer .bar:nth-child(13) { animation-delay: 0.25s; height: 16px; }
        .recording-visualizer .bar:nth-child(14) { animation-delay: 0.15s; height: 24px; }
        .recording-visualizer .bar:nth-child(15) { animation-delay: 0.0s; height: 20px; }
        .recording-visualizer .bar:nth-child(16) { animation-delay: 0.2s; height: 12px; }
        .recording-visualizer .bar:nth-child(17) { animation-delay: 0.1s; height: 26px; }
        .recording-visualizer .bar:nth-child(18) { animation-delay: 0.3s; height: 18px; }
        .recording-visualizer .bar:nth-child(19) { animation-delay: 0.05s; height: 28px; }
        .recording-visualizer .bar:nth-child(20) { animation-delay: 0.25s; height: 20px; }

        @keyframes wave {
            0% { height: 3px; }
            100% { height: 32px; }
        }

        /* Recording status text */
        .recording-status {
            display: none;
            font-size: 12px;
            color: #ff4d4f;
            font-weight: 600;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .recording-status.active {
            display: flex;
        }
        .recording-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4d4f;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .recording-status .timer {
            color: #888;
            font-weight: 400;
            margin-left: auto;
            font-variant-numeric: tabular-nums;
        }

        /* Input & Output areas */
        .translation-textarea {
            width: 100%;
            min-height: 80px;
            border: none;
            outline: none;
            resize: none;
            font-size: 18px;
            font-weight: 500;
            color: #1a1a2e;
            background: transparent;
            font-family: inherit;
            line-height: 1.6;
            padding: 0;
            margin-bottom: 4px;
        }
        .translation-textarea::placeholder {
            color: #bfbfbf;
            font-style: italic;
            font-weight: 400;
            font-size: 16px;
        }

        .translation-divider {
            height: 1px;
            background: linear-gradient(90deg, #e8e8e8 0%, #40A9FF 50%, #e8e8e8 100%);
            margin: 6px 0 8px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .translation-divider.has-result {
            opacity: 0.8;
        }

        .translation-result {
            min-height: 48px;
            font-size: 18px;
            font-weight: 500;
            color: #1a1a2e;
            line-height: 1.6;
            padding: 4px 0;
            word-wrap: break-word;
            position: relative;
        }
        .translation-result .placeholder {
            color: #bfbfbf;
            font-style: italic;
            font-weight: 400;
            font-size: 16px;
        }
        .translation-result .translated-text {
            color: #1a1a2e;
        }
        .translation-result .result-label {
            font-size: 11px;
            font-weight: 600;
            color: #40A9FF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
        }

        /* Bottom bar: language switcher + controls */
        .panel-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f5f7fa;
            border-radius: 24px;
            padding: 4px 6px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .lang-btn:hover { background: rgba(64,169,255,0.08); }
        .lang-btn.source-active {
            background: #e6f7ff;
            color: #1890ff;
            font-weight: 600;
        }
        .lang-btn.target-active {
            background: #f6ffed;
            color: #52c41a;
            font-weight: 600;
        }
        .switch-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: #e6f7ff;
            color: #1890ff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .switch-btn:hover {
            background: #1890ff;
            color: #fff;
            transform: rotate(180deg);
        }
        .switch-btn:active {
            transform: rotate(180deg) scale(0.9);
        }

        /* Action buttons group */
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f5f7fa;
            color: #555;
            flex-shrink: 0;
            position: relative;
        }
        .action-btn:hover {
            transform: scale(1.05);
            background: #e8ecf1;
        }
        .action-btn:active { transform: scale(0.93); }
        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.2s;
        }

        /* Mic button */
        .action-btn.mic-btn {
            background: #f0f0f0;
            color: #444;
        }
        .action-btn.mic-btn:hover {
            background: #e6e6e6;
        }
        .action-btn.mic-btn.recording {
            background: #ff4d4f;
            color: #fff;
            animation: mic-pulse 1.2s ease-in-out infinite;
        }
        .action-btn.mic-btn.recording:hover {
            background: #ff7875;
        }
        .action-btn.mic-btn.processing {
            background: #faad14;
            color: #fff;
            pointer-events: none;
        }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,79,0.4); }
            50% { box-shadow: 0 0 0 14px rgba(255,77,79,0); }
        }

        /* Speak button */
        .action-btn.speak-btn {
            background: #f0f5ff;
            color: #1890ff;
        }
        .action-btn.speak-btn:hover {
            background: #d6e8ff;
        }
        .action-btn.speak-btn.speaking {
            background: #52c41a;
            color: #fff;
            animation: speak-pulse 0.8s ease-in-out infinite;
        }
        @keyframes speak-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(82,196,26,0.3); }
            50% { box-shadow: 0 0 0 10px rgba(82,196,26,0); }
        }

        /* Translate button */
        .action-btn.translate-btn {
            width: auto;
            border-radius: 24px;
            padding: 0 20px;
            background: linear-gradient(135deg, #40A9FF, #1890ff);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            gap: 4px;
            height: 40px;
        }
        .action-btn.translate-btn:hover {
            background: linear-gradient(135deg, #1890ff, #096dd9);
            box-shadow: 0 4px 16px rgba(24,144,255,0.3);
        }
        .action-btn.translate-btn:active {
            transform: scale(0.97);
        }
        .action-btn.translate-btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .action-btn.translate-btn .btn-text {
            display: inline;
        }
        .action-btn.translate-btn .btn-icon {
            display: inline-flex;
        }

        /* ===== Spinner ===== */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Auto-translate toggle ===== */
        .auto-translate-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 0 2px;
        }
        .auto-translate-bar label {
            font-size: 13px;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: #ddd;
            border-radius: 11px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: #40A9FF;
        }
        .toggle-switch .toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .toggle-switch.active .toggle-knob {
            transform: translateX(18px);
        }
        .auto-translate-bar .hint {
            font-size: 11px;
            color: #bbb;
            margin-left: auto;
        }

        /* ===== Language Config Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 28px 24px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: modal-in 0.3s ease;
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-content h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .modal-content .modal-sub {
            font-size: 13px;
            color: #999;
            margin-bottom: 16px;
        }
        .modal-close-btn {
            background: #f5f7fa;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .modal-close-btn:hover { background: #e8ecf1; }

        .lang-config .lang-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .lang-config .lang-opt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            background: #fff;
        }
        .lang-config .lang-opt:hover {
            border-color: #d0d0d0;
            background: #fafafa;
            transform: translateX(2px);
        }
        .lang-config .lang-opt.selected {
            border-color: #40A9FF;
            background: #f0f8ff;
        }
        .lang-config .lang-opt .check {
            margin-left: auto;
            color: #40A9FF;
            font-size: 20px;
            font-weight: 700;
        }
        .lang-config .lang-opt .lang-code {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 20px 0 12px;
            font-size: 12px;
            color: #ccc;
        }
        .footer .lang-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }
        .footer .lang-tags span {
            padding: 2px 10px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 11px;
            color: #999;
        }

        /* ===== Responsive ===== */
        @media (max-width: 380px) {
            body { padding: 12px; }
            .header-left h1 { font-size: 28px; }
            .translation-panel { padding: 16px 14px 12px; }
            .lang-btn { font-size: 12px; padding: 4px 8px; }
        }
        @media (min-width: 481px) {
            body { padding: 24px; }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 4px; }

        /* ===== Utility ===== */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .gap-2 { gap: 8px; }
    </style>
</head>
<body>

    <!-- ===== Header ===== -->
    <header class="header">
        <div class="header-left">
            <h1>翻译</h1>
            <div class="subtitle">随时随地，畅译无阻</div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ===== Main Translation Panel ===== -->
    <div class="translation-panel" id="translationPanel">
        <!-- Recording visualizer -->
        <div class="recording-visualizer" id="recordingVisualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <!-- Recording status -->
        <div class="recording-status" id="recordingStatus">
            <span class="dot"></span>
            <span id="recordingLabel">正在录音...</span>
            <span class="timer" id="recordingTimer">00:00</span>
        </div>

        <!-- Input textarea -->
        <textarea class="translation-textarea" id="sourceText" placeholder="请输入需要翻译的文字" rows="2" aria-label="输入原文"></textarea>

        <!-- Divider -->
        <div class="translation-divider" id="translationDivider"></div>

        <!-- Result area -->
        <div class="translation-result" id="resultArea">
            <span class="placeholder" id="resultPlaceholder">翻译结果将在此显示</span>
            <span class="translated-text hidden" id="translatedText"></span>
        </div>

        <!-- Auto-translate toggle -->
        <div class="auto-translate-bar">
            <label>
                <span class="toggle-switch active" id="autoTranslateToggle">
                    <span class="toggle-knob"></span>
                </span>
                <span>自动翻译</span>
            </label>
            <span class="hint" id="autoHint">输入后自动翻译</span>
        </div>

        <!-- Bottom bar -->
        <div class="panel-bottom">
            <!-- Language selector -->
            <div class="language-selector">
                <button class="lang-btn source-active" id="sourceLangBtn" title="源语言">简体中文</button>
                <button class="switch-btn" id="swapLangBtn" title="交换语言">⇄</button>
                <button class="lang-btn target-active" id="targetLangBtn" title="目标语言">English</button>
            </div>

            <!-- Actions -->
            <div class="panel-actions">
                <button class="action-btn translate-btn" id="translateBtn" title="翻译 (Ctrl+Enter)">
                    <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    <span class="btn-text">翻译</span>
                </button>
                <button class="action-btn mic-btn" id="micBtn" title="语音输入 (点击录音)" aria-label="语音输入">
                    <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
                </button>
                <button class="action-btn speak-btn hidden" id="speakBtn" title="朗读译文" aria-label="朗读译文">
                    <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
                <button class="action-btn hidden" id="copyBtn" title="复制译文" aria-label="复制译文">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== Footer ===== -->
    <div class="footer">
        智能翻译
        <div class="lang-tags">
            <span>简体中文</span>
            <span>English</span>
            <span>Italiano</span>
        </div>
    </div>

    <!-- ===== Language Config Modal ===== -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-content lang-config">
            <h3 id="langModalTitle">选择源语言</h3>
            <div class="modal-sub" id="langModalHint">输入文本的语言</div>
            <div class="lang-options" id="langOptions"></div>
            <button class="modal-close-btn" id="langModalClose">完成</button>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        // ===== State =====
        const state = {
            sourceLang: 'zh-CN',
            targetLang: 'en',
            sourceLabel: '简体中文',
            targetLabel: 'English',
            isListening: false,
            isProcessing: false,
            recognition: null,
            sourceText: '',
            translatedText: '',
            autoTranslate: true,
            recordingStartTime: 0,
            recordingTimerInterval: null,
            speaking: false,
        };

        // ===== DOM Elements =====
        const $ = id => document.getElementById(id);
        const sourceText = $('sourceText');
        const resultPlaceholder = $('resultPlaceholder');
        const translatedTextEl = $('translatedText');
        const sourceLangBtn = $('sourceLangBtn');
        const targetLangBtn = $('targetLangBtn');
        const swapBtn = $('swapLangBtn');
        const translateBtn = $('translateBtn');
        const micBtn = $('micBtn');
        const speakBtn = $('speakBtn');
        const copyBtn = $('copyBtn');
        const toast = $('toast');
        const langModal = $('langModal');
        const langModalTitle = $('langModalTitle');
        const langModalHint = $('langModalHint');
        const langOptions = $('langOptions');
        const langModalClose = $('langModalClose');
        const translationPanel = $('translationPanel');
        const recordingVisualizer = $('recordingVisualizer');
        const recordingStatus = $('recordingStatus');
        const recordingLabel = $('recordingLabel');
        const recordingTimer = $('recordingTimer');
        const translationDivider = $('translationDivider');
        const autoTranslateToggle = $('autoTranslateToggle');
        const autoHint = $('autoHint');

        let debounceTimer = null;

        // ===== Language Data =====
        const LANGUAGES = [
            { code: 'zh-CN', label: '简体中文', speechCode: 'zh-CN', flag: '🇨🇳' },
            { code: 'en',    label: 'English',   speechCode: 'en-US', flag: '🇬🇧' },
            { code: 'it',    label: 'Italiano',  speechCode: 'it-IT', flag: '🇮🇹' },
        ];

        function getLang(code) {
            return LANGUAGES.find(l => l.code === code) || LANGUAGES[0];
        }

        // ===== Toast =====
        let toastTimer = null;
        function showToast(msg, duration = 2500) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ===== Update UI Labels =====
        function updateLangLabels() {
            sourceLangBtn.textContent = state.sourceLabel;
            targetLangBtn.textContent = state.targetLabel;
        }

        // ===== Swap Languages =====
        function swapLanguages() {
            [state.sourceLang, state.targetLang] = [state.targetLang, state.sourceLang];
            [state.sourceLabel, state.targetLabel] = [state.targetLabel, state.sourceLabel];
            updateLangLabels();
            if (state.sourceText.trim() && state.autoTranslate) {
                performTranslation();
            }
        }

        // ===== Language Modal =====
        let langModalTarget = 'source';

        function openLangModal(target) {
            langModalTarget = target;
            const isSource = target === 'source';
            langModalTitle.textContent = isSource ? '选择源语言' : '选择目标语言';
            langModalHint.textContent = isSource ? '输入文本的语言' : '希望翻译成的语言';
            const currentCode = isSource ? state.sourceLang : state.targetLang;

            langOptions.innerHTML = '';
            LANGUAGES.forEach(l => {
                const opt = document.createElement('button');
                opt.className = 'lang-opt' + (l.code === currentCode ? ' selected' : '');
                opt.dataset.code = l.code;
                opt.innerHTML = `
                    <span>${l.flag} ${l.label}</span>
                    <span class="lang-code">${l.code}</span>
                    ${l.code === currentCode ? '<span class="check">✓</span>' : ''}
                `;
                opt.addEventListener('click', () => {
                    if (isSource) {
                        state.sourceLang = l.code;
                        state.sourceLabel = l.label;
                    } else {
                        state.targetLang = l.code;
                        state.targetLabel = l.label;
                    }
                    updateLangLabels();
                    langModal.classList.remove('show');
                    if (state.sourceText.trim() && state.autoTranslate) {
                        performTranslation();
                    }
                });
                langOptions.appendChild(opt);
            });
            langModal.classList.add('show');
        }

        sourceLangBtn.addEventListener('click', () => openLangModal('source'));
        targetLangBtn.addEventListener('click', () => openLangModal('target'));
        langModalClose.addEventListener('click', () => langModal.classList.remove('show'));
        langModal.addEventListener('click', (e) => { if (e.target === langModal) langModal.classList.remove('show'); });

        // ===== Swap =====
        swapBtn.addEventListener('click', swapLanguages);

        // ===== Auto Translate Toggle =====
        autoTranslateToggle.addEventListener('click', () => {
            state.autoTranslate = !state.autoTranslate;
            autoTranslateToggle.classList.toggle('active', state.autoTranslate);
            autoHint.textContent = state.autoTranslate ? '输入后自动翻译' : '手动翻译';
            if (state.autoTranslate && state.sourceText.trim()) {
                performTranslation();
            }
        });

        // ===== Translation API =====
        async function performTranslation() {
            const text = sourceText.value.trim();
            if (!text) {
                showToast('请输入需要翻译的文字');
                return;
            }

            state.sourceText = text;
            setTranslating(true);

            try {
                const result = await callTranslationAPI(text, state.sourceLang, state.targetLang);
                if (result) {
                    displayResult(result);
                } else {
                    throw new Error('Empty result');
                }
            } catch (err) {
                console.warn('Primary API failed:', err);
                try {
                    const result = await callTranslationAPIFallback(text, state.sourceLang, state.targetLang);
                    if (result) {
                        displayResult(result);
                    } else {
                        throw new Error('Fallback empty');
                    }
                } catch (err2) {
                    console.error('All APIs failed:', err2);
                    showToast('翻译服务暂不可用，请稍后重试');
                    clearResult();
                }
            } finally {
                setTranslating(false);
            }
        }

        function displayResult(text) {
            state.translatedText = text;
            translatedTextEl.textContent = text;
            translatedTextEl.classList.remove('hidden');
            resultPlaceholder.classList.add('hidden');
            speakBtn.classList.remove('hidden');
            copyBtn.classList.remove('hidden');
            translationDivider.classList.add('has-result');
        }

        function clearResult() {
            state.translatedText = '';
            translatedTextEl.textContent = '';
            translatedTextEl.classList.add('hidden');
            resultPlaceholder.classList.remove('hidden');
            speakBtn.classList.add('hidden');
            copyBtn.classList.add('hidden');
            translationDivider.classList.remove('has-result');
        }

        function setTranslating(loading) {
            if (loading) {
                translateBtn.classList.add('loading');
                translateBtn.querySelector('.btn-text').textContent = '翻译中';
                translateBtn.querySelector('.btn-icon').innerHTML = '<span class="spinner"></span>';
            } else {
                translateBtn.classList.remove('loading');
                translateBtn.querySelector('.btn-text').textContent = '翻译';
                translateBtn.querySelector('.btn-icon').innerHTML = `
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                `;
            }
        }

        async function callTranslationAPI(text, source, target) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}&de=translator@example.com`;
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
                let result = data.responseData.translatedText;
                result = result.replace(/&#39;/g, "'").replace(/"/g, '"').replace(/&amp;/g, '&');
                return result;
            }
            throw new Error('Invalid API response');
        }

        async function callTranslationAPIFallback(text, source, target) {
            const srcMap = { 'zh-CN': 'zh-CN', 'en': 'en', 'it': 'it' };
            const tgtMap = { 'zh-CN': 'zh-CN', 'en': 'en', 'it': 'it' };
            const s = srcMap[source] || source;
            const t = tgtMap[target] || target;
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${s}|${t}&de=translator@example.com`;
            const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
            const data = await response.json();
            if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
                let result = data.responseData.translatedText;
                result = result.replace(/&#39;/g, "'").replace(/"/g, '"').replace(/&amp;/g, '&');
                return result;
            }
            return null;
        }

        // ===== Translate Button =====
        translateBtn.addEventListener('click', performTranslation);

        // ===== Auto-translate on input =====
        sourceText.addEventListener('input', () => {
            sourceText.style.height = 'auto';
            sourceText.style.height = sourceText.scrollHeight + 'px';
            state.sourceText = sourceText.value;

            if (state.autoTranslate && sourceText.value.trim()) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => performTranslation(), 600);
            } else if (!sourceText.value.trim()) {
                clearResult();
            }
        });

        // ===== Ctrl+Enter =====
        sourceText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                performTranslation();
            }
        });

        // ===== Speech Recognition (Voice Input) =====
        function startRecording() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast('您的浏览器不支持语音识别，请使用 Chrome');
                return;
            }

            if (state.isListening) {
                stopRecording();
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;

            const langInfo = getLang(state.sourceLang);
            recognition.lang = langInfo.speechCode;

            state.recognition = recognition;
            state.isListening = true;
            state.recordingStartTime = Date.now();

            // UI: recording mode
            micBtn.classList.add('recording');
            recordingVisualizer.classList.add('active');
            recordingStatus.classList.add('active');
            translationPanel.classList.add('recording');
            recordingLabel.textContent = `正在录音 (${state.sourceLabel})`;
            micBtn.title = '点击停止录音';

            // Update mic icon to stop icon
            micBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>
                </svg>`;

            // Start timer
            startRecordingTimer();

            let finalTranscript = '';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                // Show interim results in textarea
                sourceText.value = finalTranscript + interimTranscript;
                sourceText.style.height = 'auto';
                sourceText.style.height = sourceText.scrollHeight + 'px';
                state.sourceText = sourceText.value;
            };

            recognition.onerror = (event) => {
                console.warn('Recognition error:', event.error);
                let msg = '语音识别出错';
                switch (event.error) {
                    case 'no-speech': msg = '未检测到语音'; break;
                    case 'audio-capture': msg = '无法访问麦克风'; break;
                    case 'not-allowed': msg = '麦克风权限被拒绝'; break;
                    case 'language-not-supported': msg = `${state.sourceLabel} 暂不支持语音识别`; break;
                    case 'network': msg = '网络错误，语音识别需要联网'; break;
                    case 'aborted': return;
                }
                showToast(msg);
                stopRecording(true);
            };

            recognition.onend = () => {
                if (state.isListening) {
                    stopRecording(true);
                    if (sourceText.value.trim()) {
                        performTranslation();
                    }
                }
            };

            try {
                recognition.start();
                showToast(`🎤 录音中... 请用${state.sourceLabel}说话`);
            } catch (err) {
                console.error('Start failed:', err);
                showToast('启动录音失败');
                stopRecording(true);
            }
        }

        function stopRecording(silent = false) {
            if (state.recognition) {
                try { state.recognition.stop(); } catch (e) { /* ignore */ }
                state.recognition = null;
            }

            state.isListening = false;
            stopRecordingTimer();

            // Reset UI
            micBtn.classList.remove('recording');
            recordingVisualizer.classList.remove('active');
            recordingStatus.classList.remove('active');
            translationPanel.classList.remove('recording');
            micBtn.title = '语音输入 (点击录音)';

            // Restore mic icon
            micBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <rect x="9" y="2" width="6" height="11" rx="3"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                    <line x1="8" y1="22" x2="16" y2="22"/>
                </svg>`;

            if (!silent) {
                showToast('录音已停止');
                if (sourceText.value.trim()) {
                    performTranslation();
                }
            }
        }

        function startRecordingTimer() {
            clearInterval(state.recordingTimerInterval);
            state.recordingTimerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - state.recordingStartTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                recordingTimer.textContent = `${mins}:${secs}`;
            }, 200);
        }

        function stopRecordingTimer() {
            clearInterval(state.recordingTimerInterval);
            state.recordingTimerInterval = null;
            recordingTimer.textContent = '00:00';
        }

        // Mic button: click to start/stop recording
        micBtn.addEventListener('click', () => {
            if (state.isListening) {
                stopRecording(false);
            } else {
                startRecording();
            }
        });

        // ===== Text-to-Speech (朗读译文) =====
        function speakTranslation() {
            const text = state.translatedText;
            if (!text) {
                showToast('没有可朗读的译文');
                return;
            }

            if (!window.speechSynthesis) {
                showToast('您的浏览器不支持语音合成');
                return;
            }

            if (state.speaking) {
                window.speechSynthesis.cancel();
                state.speaking = false;
                speakBtn.classList.remove('speaking');
                speakBtn.title = '朗读译文';
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            const langInfo = getLang(state.targetLang);
            utterance.lang = langInfo.speechCode;
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Try to find the best voice
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v =>
                v.lang.startsWith(langInfo.code.split('-')[0]) && v.localService
            ) || voices.find(v => v.lang.startsWith(langInfo.code.split('-')[0]));

            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }

            utterance.onstart = () => {
                state.speaking = true;
                speakBtn.classList.add('speaking');
                speakBtn.title = '停止朗读';
                showToast(`🔊 朗读中 (${state.targetLabel})`);
            };

            utterance.onend = () => {
                state.speaking = false;
                speakBtn.classList.remove('speaking');
                speakBtn.title = '朗读译文';
            };

            utterance.onerror = (e) => {
                console.warn('TTS error:', e);
                state.speaking = false;
                speakBtn.classList.remove('speaking');
                speakBtn.title = '朗读译文';
            };

            window.speechSynthesis.speak(utterance);
        }

        speakBtn.addEventListener('click', speakTranslation);

        // ===== Copy Translation =====
        copyBtn.addEventListener('click', async () => {
            const text = state.translatedText;
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                showToast('✅ 译文已复制到剪贴板');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ 译文已复制');
            }
        });

        // ===== Settings =====
        $('settingsBtn').addEventListener('click', () => {
            showToast('⚙️ 设置 v1.0 · 三语智能翻译');
        });

        // ===== Keyboard: Esc =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (langModal.classList.contains('show')) {
                    langModal.classList.remove('show');
                }
                if (state.isListening) {
                    stopRecording(false);
                }
                if (state.speaking) {
                    window.speechSynthesis.cancel();
                    state.speaking = false;
                    speakBtn.classList.remove('speaking');
                }
            }
        });

        // ===== Visibility =====
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (state.isListening) stopRecording(true);
                if (state.speaking) {
                    window.speechSynthesis.cancel();
                    state.speaking = false;
                    speakBtn.classList.remove('speaking');
                }
            }
        });

        // ===== Preload TTS voices =====
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // ===== Init =====
        sourceText.style.height = sourceText.scrollHeight + 'px';

        setTimeout(() => {
            showToast('💡 输入文字自动翻译 · 点击🎤录音翻译', 3000);
        }, 600);

        // ===== Expose for debugging =====
        window.__translator = { state, performTranslation, swapLanguages, startRecording, stopRecording };

    })();
    </script>
</body>
</html>
