<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能翻译</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:linear-gradient(145deg,#f0f4f8 0%,#f8fafc 100%);min-height:100vh;color:#1a1a2e;padding:16px;display:flex;flex-direction:column;max-width:480px;margin:0 auto}

        .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding:8px 4px 0}
        .header-left h1{font-size:34px;font-weight:800;color:#1a1a2e;letter-spacing:1px;line-height:1.2}
        .header-left .subtitle{font-size:14px;color:#8e8ea0;margin-top:2px;font-weight:400}
        .header-right{display:flex;gap:14px;align-items:center;padding-top:8px}
        .header-right .icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.7);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .header-right .icon-btn:hover{background:rgba(255,255,255,0.95);box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-1px)}
        .header-right .icon-btn svg{width:22px;height:22px;fill:none;stroke:#444;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

        .panel{background:#fff;border:2px solid #40A9FF;border-radius:20px;padding:20px 18px 14px;box-shadow:0 8px 32px rgba(64,169,255,0.10);margin-bottom:16px;transition:all 0.3s}
        .panel:focus-within{box-shadow:0 8px 32px rgba(64,169,255,0.20)}
        .panel.recording{border-color:#ff4d4f;box-shadow:0 8px 32px rgba(255,77,79,0.15)}

        .rec-bar{display:none;align-items:center;gap:2px;height:28px;padding:2px 0;margin-bottom:2px}
        .rec-bar.active{display:flex}
        .rec-bar .b{flex:1;max-width:3px;background:linear-gradient(to top,#ff4d4f,#ff7875);border-radius:2px;height:4px;animation:wave 0.8s ease-in-out infinite alternate}
        .rec-bar .b:nth-child(1){animation-delay:0.0s;height:10px}
        .rec-bar .b:nth-child(2){animation-delay:0.1s;height:18px}
        .rec-bar .b:nth-child(3){animation-delay:0.2s;height:26px}
        .rec-bar .b:nth-child(4){animation-delay:0.3s;height:22px}
        .rec-bar .b:nth-child(5){animation-delay:0.15s;height:14px}
        .rec-bar .b:nth-child(6){animation-delay:0.25s;height:28px}
        .rec-bar .b:nth-child(7){animation-delay:0.05s;height:20px}
        .rec-bar .b:nth-child(8){animation-delay:0.35s;height:24px}
        .rec-bar .b:nth-child(9){animation-delay:0.2s;height:12px}
        .rec-bar .b:nth-child(10){animation-delay:0.1s;height:16px}
        .rec-bar .b:nth-child(11){animation-delay:0.3s;height:26px}
        .rec-bar .b:nth-child(12){animation-delay:0.05s;height:20px}
        .rec-bar .b:nth-child(13){animation-delay:0.25s;height:14px}
        .rec-bar .b:nth-child(14){animation-delay:0.15s;height:22px}
        @keyframes wave{0%{height:3px}100%{height:28px}}

        .rec-stat{display:none;font-size:12px;color:#ff4d4f;font-weight:600;align-items:center;gap:6px;margin-bottom:4px}
        .rec-stat.active{display:flex}
        .rec-stat .dot{width:8px;height:8px;border-radius:50%;background:#ff4d4f;animation:blink 1s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .rec-stat .tm{color:#888;font-weight:400;margin-left:auto;font-variant-numeric:tabular-nums}

        textarea{width:100%;min-height:80px;border:none;outline:none;resize:none;font-size:18px;font-weight:500;color:#1a1a2e;background:transparent;font-family:inherit;line-height:1.6;padding:0;margin-bottom:4px}
        textarea::placeholder{color:#bfbfbf;font-style:italic;font-weight:400;font-size:16px}

        .divider{height:1px;background:linear-gradient(90deg,#e8e8e8 0%,#40A9FF 50%,#e8e8e8 100%);margin:6px 0 8px;opacity:0.4;transition:opacity 0.3s}
        .divider.show{opacity:0.8}

        .result{min-height:48px;font-size:18px;font-weight:500;color:#1a1a2e;line-height:1.6;padding:4px 0;word-wrap:break-word}
        .result .ph{color:#bfbfbf;font-style:italic;font-weight:400;font-size:16px}
        .result .tx{color:#1a1a2e}

        .bar-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #f0f0f0}

        .lang-sel{display:flex;align-items:center;gap:6px;background:#f5f7fa;border-radius:24px;padding:4px 6px}
        .lang-sel button{background:transparent;border:none;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:500;color:#555;cursor:pointer;transition:all 0.2s;font-family:inherit;white-space:nowrap}
        .lang-sel button:hover{background:rgba(64,169,255,0.08)}
        .lang-sel .src{background:#e6f7ff;color:#1890ff;font-weight:600}
        .lang-sel .tgt{background:#f6ffed;color:#52c41a;font-weight:600}
        .lang-sel .swp{width:34px;height:34px;border-radius:50%;border:none;background:#e6f7ff;color:#1890ff;font-size:18px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .lang-sel .swp:hover{background:#1890ff;color:#fff;transform:rotate(180deg)}

        .acts{display:flex;align-items:center;gap:6px}
        .acts .btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;background:#f5f7fa;color:#555;flex-shrink:0}
        .acts .btn:hover{transform:scale(1.05);background:#e8ecf1}
        .acts .btn:active{transform:scale(0.93)}
        .acts .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

        .acts .trl{width:auto;border-radius:24px;padding:0 16px;background:linear-gradient(135deg,#40A9FF,#1890ff);color:#fff;font-size:13px;font-weight:600;gap:4px;height:36px}
        .acts .trl:hover{background:linear-gradient(135deg,#1890ff,#096dd9);box-shadow:0 4px 16px rgba(24,144,255,0.3)}
        .acts .trl:active{transform:scale(0.97)}
        .acts .trl.loading{opacity:0.8;pointer-events:none}

        .acts .mic{background:#f0f0f0;color:#444}
        .acts .mic.rec{background:#ff4d4f;color:#fff;animation:pulse 1.2s ease-in-out infinite}
        .acts .mic.done{background:#52c41a;color:#fff}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,0.4)}50%{box-shadow:0 0 0 14px rgba(255,77,79,0)}}

        .acts .spk{background:#f0f5ff;color:#1890ff}
        .acts .spk.speaking{background:#52c41a;color:#fff;animation:spulse 0.8s ease-in-out infinite}
        @keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(82,196,26,0.3)}50%{box-shadow:0 0 0 10px rgba(82,196,26,0)}}

        .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}

        .autobar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:4px 0 2px}
        .autobar label{font-size:13px;color:#888;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
        .tog{position:relative;width:36px;height:20px;background:#ddd;border-radius:10px;cursor:pointer;transition:background 0.3s;flex-shrink:0}
        .tog.on{background:#40A9FF}
        .tog .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
        .tog.on .knob{transform:translateX(16px)}
        .autobar .hint{font-size:11px;color:#bbb;margin-left:auto}

        .note{display:none;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;line-height:1.5;align-items:flex-start;gap:10px}
        .note.show{display:flex}
        .note.err{background:#fff2f0;border:1px solid #ffccc7;color:#cf1322}
        .note.warn{background:#fffbe6;border:1px solid #ffe58f;color:#ad8b00}
        .note.info{background:#e6f7ff;border:1px solid #91d5ff;color:#096dd9}
        .note.ok{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
        .note .ic{font-size:18px;flex-shrink:0;margin-top:1px}
        .note .msg{flex:1}
        .note .msg strong{font-weight:700}

        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:#fff;border-radius:20px;padding:28px 24px 20px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:min 0.3s ease}
        @keyframes min{from{opacity:0;transform:scale(0.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .modal h3{font-size:20px;font-weight:700;margin-bottom:4px}
        .modal .sub{font-size:13px;color:#999;margin-bottom:16px}
        .modal button{background:#f5f7fa;border:none;padding:10px 24px;border-radius:12px;font-size:14px;font-weight:600;color:#333;cursor:pointer;font-family:inherit;transition:background 0.2s;width:100%;margin-top:8px}
        .modal button:hover{background:#e8ecf1}

        .lang-opts{display:flex;flex-direction:column;gap:8px}
        .lang-opts .opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:2px solid #f0f0f0;cursor:pointer;transition:all 0.2s;font-size:15px;font-weight:500;font-family:inherit;background:#fff}
        .lang-opts .opt:hover{border-color:#d0d0d0;background:#fafafa;transform:translateX(2px)}
        .lang-opts .opt.sel{border-color:#40A9FF;background:#f0f8ff}
        .lang-opts .opt .ck{margin-left:auto;color:#40A9FF;font-size:20px;font-weight:700}
        .lang-opts .opt .cd{font-size:11px;color:#bbb;font-weight:400}

        .diag-list{margin:12px 0}
        .diag-list .d{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
        .diag-list .d:last-child{border-bottom:none}
        .diag-list .d .lb{font-weight:600;color:#555;min-width:80px}
        .diag-list .d .st{font-size:16px}
        .diag-list .d .dt{color:#999;font-size:12px;margin-left:auto;text-align:right}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.15);opacity:0;transition:all 0.4s ease;z-index:2000;pointer-events:none;text-align:center;max-width:90%}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        .ftr{text-align:center;padding:20px 0 12px;font-size:12px;color:#ccc}
        .ftr .tags{display:flex;justify-content:center;gap:8px;margin-top:4px}
        .ftr .tags span{padding:2px 10px;background:#f5f5f5;border-radius:10px;font-size:11px;color:#999}

        @media(max-width:380px){body{padding:12px}.header-left h1{font-size:28px}.panel{padding:16px 14px 12px}.lang-sel button{font-size:12px;padding:4px 8px}}
        @media(min-width:481px){body{padding:24px}}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:4px}
        .hidden{display:none!important}
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <h1>翻译</h1>
        <div class="subtitle">随时随地，畅译无阻</div>
    </div>
    <div class="header-right">
        <button class="icon-btn" id="diagBtn" title="诊断">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </div>
</header>

<div class="note" id="noteBar"><span class="ic"></span><div class="msg"></div></div>

<div class="panel" id="panel">
    <div class="rec-bar" id="recBar">
        <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
        <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
        <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
        <div class="b"></div><div class="b"></div>
    </div>
    <div class="rec-stat" id="recStat">
        <span class="dot"></span>
        <span id="recLabel">录音中...</span>
        <span class="tm" id="recTimer">00:00</span>
    </div>

    <textarea id="srcText" placeholder="请输入需要翻译的文字" rows="2"></textarea>

    <div class="divider" id="divider"></div>

    <div class="result" id="result">
        <span class="ph" id="ph">翻译结果将在此显示</span>
        <span class="tx hidden" id="tx"></span>
    </div>

    <div class="autobar">
        <label><span class="tog on" id="autoTog"><span class="knob"></span></span><span>自动翻译</span></label>
        <span class="hint" id="autoHint">输入后自动翻译</span>
    </div>

    <div class="bar-bottom">
        <div class="lang-sel">
            <button class="src" id="srcLang">简体中文</button>
            <button class="swp" id="swpBtn">⇄</button>
            <button class="tgt" id="tgtLang">English</button>
        </div>
        <div class="acts">
            <button class="btn trl" id="trlBtn" title="翻译">
                <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span class="btn-text">翻译</span>
            </button>
            <button class="btn mic" id="micBtn" title="录音输入">
                <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
            </button>
            <button class="btn spk hidden" id="spkBtn" title="朗读译文">
                <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button class="btn hidden" id="cpyBtn" title="复制">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="ftr">智能翻译<div class="tags"><span>简体中文</span><span>English</span><span>Italiano</span></div></div>

<div class="modal-overlay" id="langModal">
    <div class="modal">
        <h3 id="langTitle">选择源语言</h3>
        <div class="sub" id="langSub">输入文本的语言</div>
        <div class="lang-opts" id="langOpts"></div>
        <button id="langClose">完成</button>
    </div>
</div>

<div class="modal-overlay" id="diagModal">
    <div class="modal">
        <h3>🔍 浏览器诊断</h3>
        <div class="sub">语音功能支持情况</div>
        <div class="diag-list" id="diagList"></div>
        <p style="font-size:12px;color:#bbb;margin-top:8px;text-align:center">💡 如语音不支持，可用键盘麦克风或直接输入文字</p>
        <button id="diagClose">关闭</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    'use strict';

    // ===== Browser Detection =====
    const UA = navigator.userAgent;
    const isAndroid = UA.includes('Android');
    const isIOS = /iPad|iPhone|iPod/.test(UA);
    let browser = '未知';
    if(UA.includes('Chrome')&&!UA.includes('Edg')) browser='Chrome';
    else if(UA.includes('Safari')&&!UA.includes('Chrome')) browser='Safari';
    else if(UA.includes('Firefox')) browser='Firefox';
    else if(UA.includes('Edg')) browser='Edge';
    else if(UA.includes('OPR')||UA.includes('Opera')) browser='Opera';
    else if(UA.includes('Samsung')) browser='Samsung Internet';
    else if(UA.includes('Miui')||UA.includes('XiaoMi')) browser='MIUI浏览器';
    else if(UA.includes('Huawei')||UA.includes('Harmony')) browser='华为浏览器';
    else if(/UCBrowser|UBrowser/.test(UA)) browser='UC浏览器';
    else if(UA.includes('QQBrowser')) browser='QQ浏览器';
    else if(UA.includes('baidubrowser')||UA.includes('BIDUBrowser')) browser='百度浏览器';

    // ===== API Detection =====
    const hasSR = !!(window.SpeechRecognition||window.webkitSpeechRecognition);
    const hasSS = !!window.speechSynthesis;
    const hasMR = !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
    const isHttpsOrLocal = location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
    const isFileProtocol = location.protocol==='file:';

    // ===== State =====
    const S = {
        src:'zh-CN', tgt:'en', srcL:'简体中文', tgtL:'English',
        listening:false, rec:null, srcT:'', transT:'', auto:true,
        recStart:0, recTimer:null, speaking:false, mediaRec:null,
        mediaStream:null, audioChunks:[], isRecording:false,
    };

    // ===== DOM =====
    const $=id=>document.getElementById(id);
    const srcText=$('srcText'), ph=$('ph'), txEl=$('tx');
    const srcLang=$('srcLang'), tgtLang=$('tgtLang'), swpBtn=$('swpBtn');
    const trlBtn=$('trlBtn'), micBtn=$('micBtn'), spkBtn=$('spkBtn'), cpyBtn=$('cpyBtn');
    const toast=$('toast'), panel=$('panel'), recBar=$('recBar'), recStat=$('recStat');
    const recLabel=$('recLabel'), recTimer=$('recTimer'), divider=$('divider');
    const autoTog=$('autoTog'), autoHint=$('autoHint'), noteBar=$('noteBar');
    const langModal=$('langModal'), langTitle=$('langTitle'), langSub=$('langSub');
    const langOpts=$('langOpts'), langClose=$('langClose');
    const diagModal=$('diagModal'), diagList=$('diagList'), diagClose=$('diagClose');

    let debounce=null, ttsWake=false, ttsVoices=[];

    const LANGS=[
        {code:'zh-CN',label:'简体中文',speech:'zh-CN',flag:'🇨🇳'},
        {code:'en',label:'English',speech:'en-US',flag:'🇬🇧'},
        {code:'it',label:'Italiano',speech:'it-IT',flag:'🇮🇹'},
    ];
    function gl(c){return LANGS.find(l=>l.code===c)||LANGS[0]}

    // ===== Toast =====
    let tt=null;
    function tst(m,d){
        toast.textContent=m;toast.classList.add('show');
        clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),d||2500);
    }

    // ===== Note Bar =====
    function showNote(type,html){
        noteBar.className='note show '+type;
        const icons={err:'🚫',warn:'⚠️',info:'💡',ok:'✅'};
        noteBar.querySelector('.ic').textContent=icons[type]||'💡';
        noteBar.querySelector('.msg').innerHTML=html;
    }
    function hideNote(){noteBar.classList.remove('show')}

    // ===== Compatibility Check =====
    function checkCompat(){
        let issues=[], warns=[];

        if(isFileProtocol&&!hasSR&&!hasMR){
            issues.push('当前页面以 file:// 协议打开，部分浏览器可能限制麦克风权限');
        }
        if(!hasSR&&!hasMR){
            issues.push('语音识别不可用');
        }
        if(!isHttpsOrLocal&&!isFileProtocol){
            warns.push('部分浏览器要求 HTTPS 才能使用麦克风');
        }
        if(browser==='Firefox'&&!hasSR) warns.push('Firefox 不支持网页语音识别');
        if(isIOS&&!hasSR) warns.push('iOS Safari 不支持网页语音识别');

        if(issues.length){
            showNote('err',issues.join('<br>')+'<br><strong>💡替代方案：</strong>在输入框中使用<strong>系统键盘的麦克风</strong>按钮直接语音输入文字');

    async function api(t,s,tg){
        const r=await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${s}|${tg}&de=translator@example.com`,
            {headers:{Accept:'application/json'}}
        );
        if(!r.ok) throw Error(`HTTP ${r.status}`);
        const d=await r.json();
        if(d.responseStatus===200&&d.responseData&&d.responseData.translatedText)
            return d.responseData.translatedText.replace(/&#39;/g,"'").replace(/"/g,'"').replace(/&amp;/g,'&');
        throw Error('bad response');
    }

    // ============================================================
    //  DUAL VOICE INPUT SYSTEM

    //  Approach 1: Web Speech API (webkitSpeechRecognition)

    let recordingMode = 'none'; // 'speech' | 'media'

    micBtn.onclick = async function() {
        if(S.isRecording) { stopMediaRec(); return; }
        if(S.listening) { stopSpeechRec(); return; }

        // Try Web Speech API first
        if(hasSR) {
            try {
                startSpeechRec();
                return;
            } catch(e) {
                console.warn('SpeechRec failed, trying MediaRecorder:', e);
            }
        }

        // Fallback: MediaRecorder
        if(hasMR) {
            await startMediaRec();
            return;

        // Nothing works
        tst('当前浏览器不支持录音，请使用键盘麦克风输入');
    };

    // ---------- Approach 1: Web Speech API ----------
    function startSpeechRec() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) { throw new Error('no SR'); }

        const rec = new SR();
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        rec.lang = gl(S.src).speech;

        S.rec = rec;
        S.listening = true;
        enterRecordingUI('speech');

        let final = '';

        rec.onresult = (e) => {
            let interim = '';
            for(let i=e.resultIndex; i<e.results.length; i++) {
                if(e.results[i].isFinal) final += e.results[i][0].transcript;
                else interim += e.results[i][0].transcript;
            }
            srcText.value = final + interim;
            srcText.style.height = 'auto';
            srcText.style.height = srcText.scrollHeight + 'px';
            S.srcT = srcText.value;
        };

        rec.onerror = (e) => {
            console.warn('SR error:', e.error);
            if(e.error === 'aborted') return;
            let msg = '语音识别出错';
            if(e.error === 'no-speech') msg = '未检测到语音';
            else if(e.error === 'not-allowed') msg = '麦克风权限被拒绝';
            else if(e.error === 'network') msg = '网络错误';
            else msg = '语音识别: '+e.error;
            tst(msg);
            exitRecordingUI();
        };

        rec.onend = () => {
            if(S.listening) {
                exitRecordingUI();
                if(srcText.value.trim()) doTrans();
            }
        };

        try {
            rec.start();
            tst('🎤 录音中... 点击停止按钮结束');
        } catch(err) {
            exitRecordingUI();
            throw err;
        }
    }

    function stopSpeechRec(silent) {
        if(S.rec) { try{S.rec.stop()}catch(e){} S.rec=null; }
        S.listening = false;
        exitRecordingUI();
        if(!silent) {
            tst('录音已停止');
            if(srcText.value.trim()) doTrans();
        }
    }

    // ---------- Approach 2: MediaRecorder (works on ALL browsers) ----------
    async function startMediaRec() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            S.mediaStream = stream;

            // Find best format
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                ? 'audio/webm;codecs=opus'
                : MediaRecorder.isTypeSupported('audio/webm')
                    ? 'audio/webm'
                    : MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')
                        ? 'audio/ogg;codecs=opus'
                        : '';

            const rec = new MediaRecorder(stream, mimeType ? {mimeType} : {});
            S.mediaRec = rec;
            S.audioChunks = [];
            S.isRecording = true;

            enterRecordingUI('media');

            rec.ondataavailable = (e) => {
                if(e.data.size > 0) S.audioChunks.push(e.data);
            };

            rec.onstop = () => {
                S.isRecording = false;
                if(S.mediaStream) {
                    S.mediaStream.getTracks().forEach(t=>t.stop());
                    S.mediaStream = null;
                }
                exitRecordingUI();

                // Create audio blob
                const blob = new Blob(S.audioChunks, {type: mimeType || 'audio/webm'});
                S.audioChunks = [];

                if(blob.size === 0) {
                    tst('未录制到音频');
                    return;
                }

                // Show success and play button
                tst('✅ 录音完成！('+formatSize(blob.size)+')');

                // Change mic to play button temporarily
                micBtn.classList.add('done');
                micBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19 8 5" fill="currentColor" stroke="none"/></svg>`;
                micBtn.title = '播放录音';

                // Store blob for playback
                S.lastAudioBlob = blob;

                // After playing, or on next click, revert
                const playFn = async () => {
                    micBtn.removeEventListener('click', playFn);
                    micBtn.classList.remove('done');
                    micBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>`;
                    micBtn.title = '录音输入';

                    // Play the audio
                    try {
                        const url = URL.createObjectURL(blob);
                        const audio = new Audio(url);
                        audio.onended = () => { URL.revokeObjectURL(url); };
                        await audio.play();
                        tst('🔊 播放录音');

                        // Try to recognize using Google Speech API
                        if(isHttpsOrLocal || !isFileProtocol) {
                            try {
                                const text = await googleSpeechAPI(blob, gl(S.src).speech);
                                if(text && text.trim()) {
                                    srcText.value = text;
                                    srcText.style.height = 'auto';
                                    srcText.style.height = srcText.scrollHeight + 'px';
                                    S.srcT = text;
                                    tst('✅ 语音转文字成功');
                                    doTrans();
                                }
                            } catch(e) {
                                console.warn('Google ASR failed:', e);
                                // Not a big deal, user can type
                            }
                        }
                    } catch(e) {
                        console.warn('Playback error:', e);
                    }
                };
                micBtn.addEventListener('click', playFn, {once:true});
            };

            rec.start(250); // Collect data every 250ms
            tst('🎤 录音中... 点击停止结束');

        } catch(err) {
            console.error('MediaRecorder error:', err);
            if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                tst('麦克风权限被拒绝，请在浏览器设置中允许');
            } else if(err.name === 'NotFoundError') {
                tst('未找到麦克风设备');
            } else {
                tst('录音启动失败: '+err.message);
            }
            S.isRecording = false;
            exitRecordingUI();
        }
    }

    function stopMediaRec() {
        if(S.mediaRec && S.mediaRec.state !== 'inactive') {
            S.mediaRec.stop();
        } else {
            if(S.mediaStream) {
                S.mediaStream.getTracks().forEach(t=>t.stop());
                S.mediaStream = null;
            }
            S.isRecording = false;
            exitRecordingUI();
            tst('录音已取消');
        }
    }

    // ---------- Google Speech API (free, no key needed) ----------
    async function googleSpeechAPI(blob, lang) {
        // Convert blob to PCM16 via AudioContext
        const arrayBuffer = await blob.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Decode the audio
        let audioBuffer;
        try {
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        } catch(e) {
            // Try resampling
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        }

        // Resample to 16kHz mono
        const targetSampleRate = 16000;
        const origSampleRate = audioBuffer.sampleRate;
        const origLength = audioBuffer.length;
        const numChannels = audioBuffer.numberOfChannels;

        // Mix down to mono and resample
        const ratio = origSampleRate / targetSampleRate;
        const newLength = Math.round(origLength / ratio);
        const newData = new Float32Array(newLength);

        // Mix channels and downsample
        const channelData = [];
        for(let c=0; c<numChannels; c++) {
            channelData.push(audioBuffer.getChannelData(c));
        }

        for(let i=0; i<newLength; i++) {
            const origIndex = Math.round(i * ratio);
            let sample = 0;
            for(let c=0; c<numChannels; c++) {
                sample += channelData[c][Math.min(origIndex, origLength-1)];
            }
            sample /= numChannels;
            newData[i] = sample;
        }

        // Convert to 16-bit PCM
        const pcmData = new Int16Array(newLength);
        for(let i=0; i<newLength; i++) {
            const s = Math.max(-1, Math.min(1, newData[i]));
            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // Send to Google Speech API
        const apiKey = 'AIzaSyBOti4mM-6x9WDnZIjIeyEU21OpBXqWBgw';
        const url = `https://www.google.com/speech-api/v2/recognize?output=json&lang=${encodeURIComponent(lang)}&key=${apiKey}`;

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'audio/l16; rate=16000; channels=1',
            },
            body: pcmData.buffer,
        });

        if(!response.ok) throw new Error(`Google ASR HTTP ${response.status}`);

        const text = await response.text();
        // Parse multi-line JSON response (Google returns multiple JSON lines)
        const lines = text.trim().split('\n');
        for(const line of lines) {
            try {
                const data = JSON.parse(line);
                if(data.result && data.result[0] && data.result[0].alternative && data.result[0].alternative[0]) {
                    return data.result[0].alternative[0].transcript;
                }
            } catch(e) {}
        }
        throw new Error('No transcription in response');
    }

    function formatSize(bytes) {

    }

    // ============================================================
    //  TEXT-TO-SPEECH (朗读) - Fixed for all browsers
    // ============================================================
    function speak() {
        const text = S.transT;
        if(!text) { tst('暂无译文可朗读'); return; }
        if(!window.speechSynthesis) { tst('不支持语音合成'); return; }

        if(S.speaking) {
            speechSynthesis.cancel();
            S.speaking=false; spkBtn.classList.remove('speaking'); spkBtn.title='朗读译文';
            tst('朗读已停止'); return;
        }

        wakeTTS();
        speechSynthesis.cancel();

        const langInfo = gl(S.tgt);
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = langInfo.speech;
        utter.rate = 0.9;
        utter.pitch = 1.0;
        utter.volume = 1.0;

        // Find voice
        const prefix = langInfo.speech.split('-')[0];
        let voice = null;
        if(ttsVoices.length>0) {
            voice = ttsVoices.find(v=>v.lang.startsWith(prefix)&&v.localService)
                 || ttsVoices.find(v=>v.lang.startsWith(prefix))
                 || ttsVoices.find(v=>v.lang.startsWith('en'));
        } else {
            const v = speechSynthesis.getVoices();
            if(v.length>0) {
                ttsVoices = v;
                voice = v.find(vo=>vo.lang.startsWith(prefix));
            }
        }
        if(voice) utter.voice = voice;

        utter.onstart = () => {
            S.speaking=true; spkBtn.classList.add('speaking');
            spkBtn.title='停止朗读'; tst('🔊 朗读中 ('+S.tgtL+')');
        };
        utter.onend = () => {
            S.speaking=false; spkBtn.classList.remove('speaking');
            spkBtn.title='朗读译文';
        };
        utter.onerror = (e) => {
            S.speaking=false; spkBtn.classList.remove('speaking');
            spkBtn.title='朗读译文';
            if(e.error!=='canceled'&&e.error!=='interrupted')
                tst('朗读失败');
        };

        setTimeout(()=>{try{speechSynthesis.speak(utter)}catch(e){
            S.speaking=false;spkBtn.classList.remove('speaking');tst('朗读启动失败');
        }}, 50);
    }
    spkBtn.onclick = speak;
