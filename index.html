<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能翻译 - 有道</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:linear-gradient(145deg,#f0f4f8 0%,#f8fafc 100%);min-height:100vh;color:#1a1a2e;padding:16px;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding:8px 4px 0}
        .header-left h1{font-size:34px;font-weight:800;color:#1a1a2e;letter-spacing:1px;line-height:1.2}
        .header-left .subtitle{font-size:14px;color:#8e8ea0;margin-top:2px;font-weight:400}
        .header-right{display:flex;gap:14px;align-items:center;padding-top:8px}
        .header-right .icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.7);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .header-right .icon-btn:hover{background:rgba(255,255,255,0.95);box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-1px)}
        .header-right .icon-btn svg{width:22px;height:22px;fill:none;stroke:#444;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .panel{background:#fff;border:2px solid #40A9FF;border-radius:20px;padding:20px 18px 14px;box-shadow:0 8px 32px rgba(64,169,255,0.10);margin-bottom:16px;transition:all 0.3s}
        .panel:focus-within{box-shadow:0 8px 32px rgba(64,169,255,0.20)}
        .panel.recording{border-color:#ff4d4f;box-shadow:0 8px 32px rgba(255,77,79,0.15)}
        .rec-bar{display:none;align-items:center;gap:2px;height:28px;padding:2px 0;margin-bottom:2px}
        .rec-bar.active{display:flex}
        .rec-bar .b{flex:1;max-width:3px;background:linear-gradient(to top,#ff4d4f,#ff7875);border-radius:2px;height:4px;animation:wave 0.8s ease-in-out infinite alternate}
        .rec-bar .b:nth-child(1){animation-delay:0.0s;height:10px}
        .rec-bar .b:nth-child(2){animation-delay:0.1s;height:18px}
        .rec-bar .b:nth-child(3){animation-delay:0.2s;height:26px}
        .rec-bar .b:nth-child(4){animation-delay:0.3s;height:22px}
        .rec-bar .b:nth-child(5){animation-delay:0.15s;height:14px}
        .rec-bar .b:nth-child(6){animation-delay:0.25s;height:28px}
        .rec-bar .b:nth-child(7){animation-delay:0.05s;height:20px}
        .rec-bar .b:nth-child(8){animation-delay:0.35s;height:24px}
        .rec-bar .b:nth-child(9){animation-delay:0.2s;height:12px}
        .rec-bar .b:nth-child(10){animation-delay:0.1s;height:16px}
        .rec-bar .b:nth-child(11){animation-delay:0.3s;height:26px}
        .rec-bar .b:nth-child(12){animation-delay:0.05s;height:20px}
        .rec-bar .b:nth-child(13){animation-delay:0.25s;height:14px}
        .rec-bar .b:nth-child(14){animation-delay:0.15s;height:22px}
        @keyframes wave{0%{height:3px}100%{height:28px}}
        .rec-stat{display:none;font-size:12px;color:#ff4d4f;font-weight:600;align-items:center;gap:6px;margin-bottom:4px}
        .rec-stat.active{display:flex}
        .rec-stat .dot{width:8px;height:8px;border-radius:50%;background:#ff4d4f;animation:blink 1s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .rec-stat .tm{color:#888;font-weight:400;margin-left:auto;font-variant-numeric:tabular-nums}
        textarea{width:100%;min-height:80px;border:none;outline:none;resize:none;font-size:18px;font-weight:500;color:#1a1a2e;background:transparent;font-family:inherit;line-height:1.6;padding:0;margin-bottom:4px}
        textarea::placeholder{color:#bfbfbf;font-style:italic;font-weight:400;font-size:16px}
        .divider{height:1px;background:linear-gradient(90deg,#e8e8e8 0%,#40A9FF 50%,#e8e8e8 100%);margin:6px 0 8px;opacity:0.4;transition:opacity 0.3s}
        .divider.show{opacity:0.8}
        .result{min-height:48px;font-size:18px;font-weight:500;color:#1a1a2e;line-height:1.6;padding:4px 0;word-wrap:break-word}
        .result .ph{color:#bfbfbf;font-style:italic;font-weight:400;font-size:16px}
        .result .tx{color:#1a1a2e}
        .bar-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #f0f0f0}
        .lang-sel{display:flex;align-items:center;gap:6px;background:#f5f7fa;border-radius:24px;padding:4px 6px;overflow:hidden}
        .lang-sel button{background:transparent;border:none;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:500;color:#555;cursor:pointer;transition:all 0.2s;font-family:inherit;white-space:nowrap}
        .lang-sel button:hover{background:rgba(64,169,255,0.08)}
        .lang-sel .src{background:#e6f7ff;color:#1890ff;font-weight:600}
        .lang-sel .tgt{background:#f6ffed;color:#52c41a;font-weight:600}
        .lang-sel .swp{width:30px;height:30px;border-radius:50%;border:none;background:#e6f7ff;color:#1890ff;font-size:16px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
        .lang-sel .swp:hover{background:#1890ff;color:#fff;transform:rotate(180deg)}
        .acts{display:flex;align-items:center;gap:6px}
        .acts .btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;background:#f5f7fa;color:#555;flex-shrink:0}
        .acts .btn:hover{transform:scale(1.05);background:#e8ecf1}
        .acts .btn:active{transform:scale(0.93)}
        .acts .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .acts .trl{width:auto;border-radius:24px;padding:0 14px;background:linear-gradient(135deg,#40A9FF,#1890ff);color:#fff;font-size:13px;font-weight:600;gap:4px;height:36px}
        .acts .trl:hover{background:linear-gradient(135deg,#1890ff,#096dd9);box-shadow:0 4px 16px rgba(24,144,255,0.3)}
        .acts .trl:active{transform:scale(0.97)}
        .acts .trl.loading{opacity:0.8;pointer-events:none}
        .acts .mic{background:#f0f0f0;color:#444}
        .acts .mic.rec{background:#ff4d4f;color:#fff;animation:pulse 1.2s ease-in-out infinite}
        .acts .mic.done{background:#52c41a;color:#fff}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,0.4)}50%{box-shadow:0 0 0 14px rgba(255,77,79,0)}}
        .acts .spk{background:#f0f5ff;color:#1890ff}
        .acts .spk.speaking{background:#52c41a;color:#fff;animation:spulse 0.8s ease-in-out infinite}
        @keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(82,196,26,0.3)}50%{box-shadow:0 0 0 10px rgba(82,196,26,0)}}
        .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        .autobar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:4px 0 2px}
        .autobar label{font-size:13px;color:#888;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
        .tog{position:relative;width:36px;height:20px;background:#ddd;border-radius:10px;cursor:pointer;transition:background 0.3s;flex-shrink:0}
        .tog.on{background:#40A9FF}
        .tog .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
        .tog.on .knob{transform:translateX(16px)}
        .autobar .hint{font-size:11px;color:#bbb;margin-left:auto}
        .note{display:none;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px;line-height:1.5;align-items:flex-start;gap:10px}
        .note.show{display:flex}
        .note.err{background:#fff2f0;border:1px solid #ffccc7;color:#cf1322}
        .note.warn{background:#fffbe6;border:1px solid #ffe58f;color:#ad8b00}
        .note.info{background:#e6f7ff;border:1px solid #91d5ff;color:#096dd9}
        .note.ok{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
        .note .ic{font-size:18px;flex-shrink:0;margin-top:1px}
        .note .msg{flex:1}.note .msg strong{font-weight:700}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:#fff;border-radius:20px;padding:28px 24px 20px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:min 0.3s ease}
        @keyframes min{from{opacity:0;transform:scale(0.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .modal h3{font-size:20px;font-weight:700;margin-bottom:4px}
        .modal .sub{font-size:13px;color:#999;margin-bottom:16px}
        .modal .btn{background:#f5f7fa;border:none;padding:10px 24px;border-radius:12px;font-size:14px;font-weight:600;color:#333;cursor:pointer;font-family:inherit;transition:background 0.2s;width:100%;margin-top:8px}
        .modal .btn:hover{background:#e8ecf1}
        .lang-opts{display:flex;flex-direction:column;gap:8px}
        .lang-opts .opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:2px solid #f0f0f0;cursor:pointer;transition:all 0.2s;font-size:15px;font-weight:500;font-family:inherit;background:#fff}
        .lang-opts .opt:hover{border-color:#d0d0d0;background:#fafafa;transform:translateX(2px)}
        .lang-opts .opt.sel{border-color:#40A9FF;background:#f0f8ff}
        .lang-opts .opt .ck{margin-left:auto;color:#40A9FF;font-size:20px;font-weight:700}
        .lang-opts .opt .cd{font-size:11px;color:#bbb;font-weight:400}
        .diag-list{margin:12px 0}
        .diag-list .d{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
        .diag-list .d:last-child{border-bottom:none}
        .diag-list .d .lb{font-weight:600;color:#555;min-width:80px}
        .diag-list .d .st{font-size:16px}
        .diag-list .d .dt{color:#999;font-size:12px;margin-left:auto;text-align:right}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,0.15);opacity:0;transition:all 0.4s ease;z-index:2000;pointer-events:none;text-align:center;max-width:90%}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        .ftr{text-align:center;padding:20px 0 12px;font-size:12px;color:#ccc}
        .ftr .tags{display:flex;justify-content:center;gap:8px;margin-top:4px}
        .ftr .tags span{padding:2px 10px;background:#f5f5f5;border-radius:10px;font-size:11px;color:#999}
        @media(max-width:380px){body{padding:12px}.header-left h1{font-size:28px}.panel{padding:16px 14px 12px}.lang-sel button{font-size:12px;padding:4px 6px}}
        @media(min-width:481px){body{padding:24px}}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:4px}
        .hidden{display:none!important}
    </style>
</head>

<div class="note" id="noteBar"><span class="ic"></span><div class="msg"></div></div>

<div class="panel" id="panel">

    </div>
</div>

<div class="ftr">有道智能翻译<div class="tags"><span>简体中文</span><span>English</span><span>Italiano</span></div></div>

<div class="modal-overlay" id="langModal">
    <div class="modal">
        <h3 id="langTitle">选择源语言</h3>
        <div class="sub" id="langSub">输入文本的语言</div>
        <div class="lang-opts" id="langOpts"></div>
        <button class="btn" id="langClose">完成</button>
    </div>
</div>

<div class="modal-overlay" id="diagModal">
    <div class="modal">
        <h3>🔍 诊断</h3>

        <div class="diag-list" id="diagList"></div>
        <button class="btn" id="diagClose">关闭</button>

</div>

<div class="toast" id="toast"></div>

    // SHA256 (用于有道 v3 签名 - 翻译)
    async function sha256(str){
        const enc=new TextEncoder(),data=enc.encode(str);
        const buf=await crypto.subtle.digest('SHA-256',data);
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    // 有道 truncate (取前10+长度+后10)
    function truncate(q){
        const len=q.length;
        if(len<=20)return q;
        return q.substring(0,10)+len+q.substring(len-10);
    }

    // 文本翻译 (v3 签名)
    async function youdaoTranslate(text, from, to){
        const salt=uuid(), curtime=Math.floor(Date.now()/1000);
        const sign=await sha256(YOUDAO_APP_ID+truncate(text)+salt+curtime+YOUDAO_APP_KEY);
        const body=new URLSearchParams({
            q:text, from, to,
            appKey:YOUDAO_APP_ID, salt, sign,
            signType:'v3', curtime:''+curtime
        });
        const resp=await fetch('https://openapi.youdao.com/api',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body
        });
        const data=await resp.json();
        if(data.errorCode==='0'&&data.translation&&data.translation.length>0)
            return data.translation[0];
        throw new Error('有道翻译错误: '+data.errorCode+' '+JSON.stringify(data));
    }

    // TTS 语音合成 (v1 签名, 返回音频 Blob)
    async function youdaoTTS(text, lang){
        const salt=uuid();
        const sign=md5(YOUDAO_APP_ID+text+salt+YOUDAO_APP_KEY);
        const body=new URLSearchParams({
            q:text, lang,
            appKey:YOUDAO_APP_ID, salt, sign,
            voice:'0', format:'mp3', rate:'16000'
        });
        const resp=await fetch('https://openapi.youdao.com/ttsapi',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body
        });
        if(!resp.ok)throw new Error('TTS HTTP '+resp.status);
        return await resp.blob();
    }

    // ASR 语音识别 (v1 签名, 需要 base64 音频)
    async function youdaoASR(base64Audio, lang, format){
        const q=base64Audio;
        const salt=uuid();
        const sign=md5(YOUDAO_APP_ID+q+salt+YOUDAO_APP_KEY);
        const body=new URLSearchParams({
            q, lang,
            appKey:YOUDAO_APP_ID, salt, sign,
            rate:'16000', format:format||'wav', channel:'1'
        });
        const resp=await fetch('https://openapi.youdao.com/asrapi',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body
        });
        const data=await resp.json();
        if(data.errorCode==='0'&&data.result&&data.result.length>0)
            return data.result[0];
        throw new Error('有道ASR错误: '+data.errorCode+' '+JSON.stringify(data));
    }

    // ============================================================
    //  Blob/ArrayBuffer → WAV (16kHz, mono, PCM16) → Base64
    // ============================================================
    async function audioBlobToWavBase64(blob){
        const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        const buf=await blob.arrayBuffer();
        let audioBuf;
        try{audioBuf=await audioCtx.decodeAudioData(buf)}
        catch(e){
            // try once more
            audioBuf=await audioCtx.decodeAudioData(buf.slice(0));
        }
        // Resample to 16kHz mono
        const rate=audioBuf.sampleRate, len=audioBuf.length, ch=audioBuf.numberOfChannels;
        const targetRate=16000;
        const newLen=Math.round(len*targetRate/rate);
        const newData=new Float32Array(newLen);
        // Mix channels
        const chData=[];
        for(let c=0;c<ch;c++)chData.push(audioBuf.getChannelData(c));
        for(let i=0;i<newLen;i++){
            const srcIdx=Math.min(Math.round(i*rate/targetRate),len-1);
            let s=0;
            for(let c=0;c<ch;c++)s+=chData[c][srcIdx];
            s/=ch;
            newData[i]=Math.max(-1,Math.min(1,s));
        }
        // Convert to PCM16
        const pcm=new Int16Array(newLen);
        for(let i=0;i<newLen;i++){
            const s=newData[i];
            pcm[i]=s<0?s*0x8000:s*0x7FFF;
        }
        // Build WAV header
        const dataLen=pcm.length*2;
        const bufOut=new ArrayBuffer(44+dataLen);
        const view=new DataView(bufOut);
        function wStr(offset,str){for(let i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i))}
        wStr(0,'RIFF');
        view.setUint32(4,36+dataLen,true);
        wStr(8,'WAVE');
        wStr(12,'fmt ');
        view.setUint32(16,16,true);
        view.setUint16(20,1,true);
        view.setUint16(22,1,true);
        view.setUint32(24,targetRate,true);
        view.setUint32(28,targetRate*2,true);
        view.setUint16(32,2,true);
        view.setUint16(34,16,true);
        wStr(36,'data');
        view.setUint32(40,dataLen,true);
        const pcmView=new Int16Array(bufOut,44,newLen);
        pcmView.set(pcm);
        // To Base64
        const bytes=new Uint8Array(bufOut);
        let binary='';
        for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
        return btoa(binary);
    }

    async function playYoudaoTTS(text, langCode){
        const yLang=ttsVoiceMap[langCode]||langCode;

        if(youdaoTTSSupported.includes(yLang)){

            return new Promise((resolve,reject)=>{
                const audio=new Audio(url);
                audio.onended=()=>{URL.revokeObjectURL(url);resolve()};
                audio.onerror=(e)=>{URL.revokeObjectURL(url);reject(e)};
                audio.play().catch(reject);
            });
        }

    // 备用翻译 (MyMemory)
    async function mymemoryTranslate(text,from,to){
        const map={'zh-CHS':'zh-CN','en':'en','it':'it'};

        const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${s}|${t}&de=translator@example.com`,{headers:{Accept:'application/json'}});
        const d=await r.json();
        if(d.responseStatus===200&&d.responseData&&d.responseData.translatedText)
            return d.responseData.translatedText.replace(/&#39;/g,"'").replace(/"/g,'"').replace(/&amp;/g,'&');

    }

    // --- 模式1: Web Speech API ---
    function startSpeechRec(){
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

        const rec=new SR();
        rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;

        rec.lang=disp.speech;
        S.rec=rec;S.listening=true;
        enterRecUI('speech');
        let final='';
        rec.onresult=e=>{
            let interim='';
            for(let i=e.resultIndex;i<e.results.length;i++){
                if(e.results[i].isFinal)final+=e.results[i][0].transcript;
                else interim+=e.results[i][0].transcript;
            }
            srcText.value=final+interim;srcText.style.height='auto';srcText.style.height=srcText.scrollHeight+'px';S.srcT=srcText.value;
        };
        rec.onerror=e=>{if(e.error!=='aborted'){tst('语音识别: '+e.error);exitRecUI()}};
        rec.onend=()=>{if(S.listening){exitRecUI();if(srcText.value.trim())doTrans()}};
        try{rec.start();tst('🎤 录音中... 点击停止')}catch(err){exitRecUI();throw err}
    }

    // --- 模式2: MediaRecorder + 有道ASR ---
    async function startMediaRec(){
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:true});
            S.mediaStream=stream;
            const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus'
                      :MediaRecorder.isTypeSupported('audio/webm')?'audio/webm'
                      :MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')?'audio/ogg;codecs=opus':'';
            const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});
            S.mediaRec=rec;S.audioChunks=[];S.isRecording=true;
            enterRecUI('media');
            rec.ondataavailable=e=>{if(e.data.size>0)S.audioChunks.push(e.data)};
            rec.onstop=async()=>{
                S.isRecording=false;
                if(S.mediaStream){S.mediaStream.getTracks().forEach(t=>t.stop());S.mediaStream=null}
                exitRecUI();
                const blob=new Blob(S.audioChunks,{type:mime||'audio/webm'});
                S.audioChunks=[];
                if(blob.size===0){tst('未录制到音频');return}
                tst('✅ 录音完成 ('+fmtSize(blob.size)+')，正在识别...');
                // 有道 ASR
                try{
                    const disp=getDisp(S.src);
                    const yLang=disp.code; // zh-CHS / en / it
                    if(yLang==='it'){
                        // Italian not supported by Youdao ASR, just play

                        S.srcT=text;tst('✅ 语音转文字成功');
                        if(S.auto)doTrans();
                    }else{tst('未能识别出文字，可手动输入')}
                }catch(e){
                    console.warn('有道ASR失败:',e);
                    tst('语音识别失败，播放录音 (可在输入框手动修正)');
                    playAudioBlob(blob);
                }
            };
            rec.start(250);tst('🎤 录音中... 点击停止');
        }catch(err){
            console.error('MediaRec error:',err);
            if(err.name==='NotAllowedError')tst('麦克风权限被拒绝');
            else if(err.name==='NotFoundError')tst('未找到麦克风');
            else tst('录音启动失败: '+err.message);
            S.isRecording=false;exitRecUI();
        }
    }

    function stopMediaRec(){
        if(S.mediaRec&&S.mediaRec.state!=='inactive'){S.mediaRec.stop()}
        else{if(S.mediaStream){S.mediaStream.getTracks().forEach(t=>t.stop());S.mediaStream=null}S.isRecording=false;exitRecUI();tst('已取消')}
    }

    function playAudioBlob(blob){
        const url=URL.createObjectURL(blob);
        const audio=new Audio(url);
        audio.onended=()=>URL.revokeObjectURL(url);
        audio.play().catch(()=>tst('播放失败'));
    }

    // --- Recording UI ---
    let recMode='none';
    function enterRecUI(mode){
        recMode=mode;panel.classList.add('recording');recBar.classList.add('active');
        recStat.classList.add('active');
        recLabel.textContent='录音中 ('+(mode==='speech'?getDisp(S.src).label:'有道ASR')+')';
        micBtn.classList.add('rec');micBtn.title='停止录音';
        S.recStart=Date.now();startRTimer();
    }
    function exitRecUI(){
        recMode='none';panel.classList.remove('recording');recBar.classList.remove('active');
        recStat.classList.remove('active');micBtn.classList.remove('rec');
        micBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
        micBtn.title='语音输入';stopRTimer();
    }
    function startRTimer(){clearInterval(S.recTimer);S.recTimer=setInterval(()=>{const e=Math.floor((Date.now()-S.recStart)/1000);recTimer.textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`},200)}
    function stopRTimer(){clearInterval(S.recTimer);S.recTimer=null;recTimer.textContent='00:00'}
    function fmtSize(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}

    // ============================================================
    //  朗读 (三模: 有道TTS / 浏览器TTS / 回退)
    // ============================================================
    async function speak(){
        const text=S.transT;
        if(!text){tst('请先翻译');return}
        if(S.speaking){stopSpeaking();return}

        const yLang=LANG_MAP[S.tgt]||S.tgt;

        // 尝试有道TTS (高品质,中文/英文)
        if(youdaoTTSSupported.includes(yLang)){
            try{
                S.speaking=true;spkBtn.classList.add('speaking');spkBtn.title='停止';
                tst('🔊 有道朗读 ('+S.tgtL+')');
                await playYoudaoTTS(text,yLang);
                S.speaking=false;spkBtn.classList.remove('speaking');spkBtn.title='朗读译文';
                return;
            }catch(e){
                console.warn('有道TTS失败,回退浏览器TTS:',e);
                S.speaking=false;spkBtn.classList.remove('speaking');
            }
        }

        // 回退: 浏览器 SpeechSynthesis
        if(!window.speechSynthesis){tst('不支持语音合成');return}
        try{
            browserSpeak(text,getDisp(S.tgt).speech);
        }catch(e){
            tst('朗读失败');
        }
    }

    function browserSpeak(text,lang){
        if(S.speaking){stopSpeaking();return}
        speechSynthesis.cancel();
        const utter=new SpeechSynthesisUtterance(text);
        utter.lang=lang;utter.rate=0.9;utter.pitch=1.0;utter.volume=1.0;
        const prefix=lang.split('-')[0];
        let voice=null;
        if(ttsVoices.length>0){
            voice=ttsVoices.find(v=>v.lang.startsWith(prefix)&&v.localService)
                ||ttsVoices.find(v=>v.lang.startsWith(prefix))
                ||ttsVoices.find(v=>v.lang.startsWith('en'));
        }else{
            const v=speechSynthesis.getVoices();
            if(v.length>0){ttsVoices=v;voice=v.find(vo=>vo.lang.startsWith(prefix))}
        }
        if(voice)utter.voice=voice;
        utter.onstart=()=>{S.speaking=true;spkBtn.classList.add('speaking');spkBtn.title='停止';tst('🔊 朗读中')};
        utter.onend=()=>{S.speaking=false;spkBtn.classList.remove('speaking');spkBtn.title='朗读译文'};
        utter.onerror=e=>{S.speaking=false;spkBtn.classList.remove('speaking');spkBtn.title='朗读译文';if(e.error!=='canceled')tst('朗读中断')};
        setTimeout(()=>{try{speechSynthesis.speak(utter)}catch(e){S.speaking=false;spkBtn.classList.remove('speaking')}},50);
    }

    function stopSpeaking(){
        if(window.speechSynthesis)speechSynthesis.cancel();
        S.speaking=false;spkBtn.classList.remove('speaking');spkBtn.title='朗读译文';
    }

    spkBtn.onclick=speak;

    // ============================================================
    //  Copy
    // ============================================================
    cpyBtn.onclick=async()=>{
        const t=S.transT;if(!t)return;
        try{await navigator.clipboard.writeText(t);tst('✅ 已复制')}
        catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);tst('✅ 已复制')}
    };

    // ============================================================
    //  Diagnostic
    // ============================================================
    function showDiag(){
        if(window.speechSynthesis){ttsVoices=speechSynthesis.getVoices().filter(v=>v.lang)}
        const items=[
            {lb:'浏览器',st:'ℹ️',dt:browser+(isAndroid?' Android':'')},
            {lb:'有道API',st:S.youdaoOk?'✅':'❌',dt:S.youdaoOk?'已连接':'未连接'},
            {lb:'语音识别API',st:hasSR?'✅':'❌',dt:hasSR?'支持':'不支持'},
            {lb:'MediaRecorder',st:hasMR?'✅':'❌',dt:hasMR?'支持':'不支持'},
            {lb:'语音合成',st:hasSS?'✅':'❌',dt:hasSS?'支持':'不支持'},
            {lb:'TTS语音库',st:ttsVoices.length>0?'✅':'⚠️',dt:ttsVoices.length+'个'},
            {lb:'有道TTS',st:'✅',dt:'中/英文高品质'},
            {lb:'有道ASR',st:'✅',dt:'中/英文识别'},
            {lb:'意大利语',st:'⚠️',dt:'浏览器TTS/ASR'},
            {lb:'源语言',st:'🎤',dt:S.srcL},
            {lb:'目标语言',st:'🔊',dt:S.tgtL},
        ];
        diagList.innerHTML=items.map(i=>`<div class="d"><span class="st">${i.st}</span><span class="lb">${i.lb}</span><span class="dt">${i.dt}</span></div>`).join('');
        diagModal.classList.add('show');
    }
    $('diagBtn').onclick=showDiag;
    diagClose.onclick=()=>diagModal.classList.remove('show');
    diagModal.onclick=e=>{if(e.target===diagModal)diagModal.classList.remove('show')};

    // ============================================================
    //  Keyboard & Visibility
    // ============================================================
    document.onkeydown=e=>{
        if(e.key==='Escape'){
            langModal.classList.contains('show')&&langModal.classList.remove('show');
            diagModal.classList.contains('show')&&diagModal.classList.remove('show');
            if(S.listening)stopSpeechRec(false);
            if(S.isRecording)stopMediaRec();
            if(S.speaking)stopSpeaking();
        }
    };
    document.addEventListener('visibilitychange',()=>{
        if(document.hidden){
            if(S.listening)stopSpeechRec(true);
            if(S.isRecording)stopMediaRec();
            if(S.speaking)stopSpeaking();
        }
    });

    // ============================================================
    //  Init
    // ============================================================
    srcText.style.height=srcText.scrollHeight+'px';
    setTimeout(checkCompat,300);

    // Wake browser TTS
    const fi=()=>{
        if(window.speechSynthesis){try{const w=new SpeechSynthesisUtterance('');w.volume=0;speechSynthesis.speak(w);speechSynthesis.cancel()}catch(e){}}
        document.removeEventListener('click',fi);document.removeEventListener('touchstart',fi)
    };
    document.addEventListener('click',fi);document.addEventListener('touchstart',fi);

    window.addEventListener('load',()=>{
        setTimeout(()=>{
            loadVoices();
            if(ttsVoices.length===0&&window.speechSynthesis){speechSynthesis.getVoices();setTimeout(loadVoices,1000)}
        },500);
    });

    setTimeout(()=>tst('💡 有道翻译引擎 · 点击🎤录音 · 点击🔊朗读',3500),800);
    window.__T={S,doTrans,swapL,speak,startMediaRec,stopMediaRec,startSpeechRec,stopSpeechRec,showDiag};
})();
</script>
</body>
</html>
